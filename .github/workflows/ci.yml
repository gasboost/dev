name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Typecheck packages
        run: pnpm -r typecheck

      - name: Test packages
        run: pnpm -r test

      - name: Test E2E cli
        run: pnpm --filter @gasboost/cli test:e2e

      - name: Test E2E console
        run: pnpm --filter @gasboost/console test:e2e

      - name: Pack packages
        run: pnpm -r pack:check

      - name: Smoke test packed packages
        run: pnpm smoke:packed

      - name: Smoke test executable
        run: pnpm --filter @gasboost/cli smoke
