name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck cli
        run: pnpm --filter @gasboost/cli typecheck

      - name: Test cli
        run: pnpm --filter @gasboost/cli test

      - name: Build cli
        run: pnpm --filter @gasboost/cli build

      - name: Test E2E cli
        run: pnpm --filter @gasboost/cli test:e2e

      - name: Pack cli
        run: pnpm --filter @gasboost/cli pack:check

      - name: Smoke test executable
        run: pnpm --filter @gasboost/cli smoke
