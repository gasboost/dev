name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-versions:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish-config: ${{ steps.versions.outputs.publish-config }}
      publish-console-runtime: ${{ steps.versions.outputs.publish-console-runtime }}
      publish-console: ${{ steps.versions.outputs.publish-console }}
      publish-cli: ${{ steps.versions.outputs.publish-cli }}
      publish-create: ${{ steps.versions.outputs.publish-create }}
      publish-fake-core: ${{ steps.versions.outputs.publish-fake-core }}
      publish-fake-node: ${{ steps.versions.outputs.publish-fake-node }}
      publish-vite: ${{ steps.versions.outputs.publish-vite }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package versions
        id: versions
        run: |
          check_package() {
            local output="$1"
            local manifest="$2"
            local name
            local version

            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")

            echo "${name}@${version}"

            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${output}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_package publish-config packages/config/package.json
          check_package publish-console-runtime packages/console-runtime/package.json
          check_package publish-console packages/console/package.json
          check_package publish-cli packages/cli/package.json
          check_package publish-create packages/create-gasboost/package.json
          check_package publish-fake-core packages/fake-core/package.json
          check_package publish-fake-node packages/fake-node/package.json
          check_package publish-vite packages/vite/package.json

  publish:
    needs: check-versions
    if: >-
      ${{
        needs.check-versions.outputs.publish-config == 'true' ||
        needs.check-versions.outputs.publish-console-runtime == 'true' ||
        needs.check-versions.outputs.publish-console == 'true' ||
        needs.check-versions.outputs.publish-cli == 'true' ||
        needs.check-versions.outputs.publish-create == 'true' ||
        needs.check-versions.outputs.publish-fake-core == 'true' ||
        needs.check-versions.outputs.publish-fake-node == 'true' ||
        needs.check-versions.outputs.publish-vite == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # fake-core is consumed by fake-node and vite.
      - name: Build fake-core
        if: >-
          ${{
            needs.check-versions.outputs.publish-fake-core == 'true' ||
            needs.check-versions.outputs.publish-fake-node == 'true' ||
            needs.check-versions.outputs.publish-vite == 'true'
          }}
        run: pnpm --filter @gasboost/fake-core build

      - name: Typecheck fake-core
        if: ${{ needs.check-versions.outputs.publish-fake-core == 'true' }}
        run: pnpm --filter @gasboost/fake-core typecheck

      - name: Test fake-core
        if: ${{ needs.check-versions.outputs.publish-fake-core == 'true' }}
        run: pnpm --filter @gasboost/fake-core test

      - name: Verify fake-core package contents
        if: ${{ needs.check-versions.outputs.publish-fake-core == 'true' }}
        working-directory: packages/fake-core
        run: pnpm pack

      - name: Publish fake-core
        if: ${{ needs.check-versions.outputs.publish-fake-core == 'true' }}
        working-directory: packages/fake-core
        run: pnpm publish --access public --no-git-checks

      # fake-node is consumed by vite.
      - name: Build fake-node
        if: >-
          ${{
            needs.check-versions.outputs.publish-fake-node == 'true' ||
            needs.check-versions.outputs.publish-vite == 'true'
          }}
        run: pnpm --filter @gasboost/fake-node build

      - name: Typecheck fake-node
        if: ${{ needs.check-versions.outputs.publish-fake-node == 'true' }}
        run: pnpm --filter @gasboost/fake-node typecheck

      - name: Test fake-node
        if: ${{ needs.check-versions.outputs.publish-fake-node == 'true' }}
        run: pnpm --filter @gasboost/fake-node test

      - name: Verify fake-node package contents
        if: ${{ needs.check-versions.outputs.publish-fake-node == 'true' }}
        working-directory: packages/fake-node
        run: pnpm pack

      - name: Publish fake-node
        if: ${{ needs.check-versions.outputs.publish-fake-node == 'true' }}
        working-directory: packages/fake-node
        run: pnpm publish --access public --no-git-checks

      - name: Typecheck vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        run: pnpm --filter @gasboost/vite typecheck

      - name: Test vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        run: |
          pnpm --filter @gasboost/vite exec playwright install --with-deps chromium
          pnpm --filter @gasboost/vite test

      - name: Build vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        run: pnpm --filter @gasboost/vite build

      - name: Verify vite package contents
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        working-directory: packages/vite
        run: pnpm pack

      - name: Publish vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        working-directory: packages/vite
        run: pnpm publish --access public --no-git-checks

      # @gasboost/config is consumed by @gasboost/console and @gasboost/cli.
      - name: Typecheck config
        if: ${{ needs.check-versions.outputs.publish-config == 'true' }}
        run: pnpm --filter @gasboost/config typecheck

      - name: Test config
        if: ${{ needs.check-versions.outputs.publish-config == 'true' }}
        run: pnpm --filter @gasboost/config test

      - name: Build config
        if: ${{ needs.check-versions.outputs.publish-config == 'true' || needs.check-versions.outputs.publish-console == 'true' || needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm --filter @gasboost/config build

      - name: Verify config package contents
        if: ${{ needs.check-versions.outputs.publish-config == 'true' }}
        working-directory: packages/config
        run: pnpm pack

      - name: Publish config
        if: ${{ needs.check-versions.outputs.publish-config == 'true' }}
        working-directory: packages/config
        run: pnpm publish --access public --no-git-checks

      # @gasboost/console-runtime is consumed by @gasboost/console.
      - name: Typecheck console-runtime
        if: ${{ needs.check-versions.outputs.publish-console-runtime == 'true' }}
        run: pnpm --filter @gasboost/console-runtime typecheck

      - name: Test console-runtime
        if: ${{ needs.check-versions.outputs.publish-console-runtime == 'true' }}
        run: pnpm --filter @gasboost/console-runtime test

      - name: Build console-runtime
        if: ${{ needs.check-versions.outputs.publish-console-runtime == 'true' || needs.check-versions.outputs.publish-console == 'true' || needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm --filter @gasboost/console-runtime build

      - name: Verify console-runtime package contents
        if: ${{ needs.check-versions.outputs.publish-console-runtime == 'true' }}
        working-directory: packages/console-runtime
        run: pnpm pack

      - name: Publish console-runtime
        if: ${{ needs.check-versions.outputs.publish-console-runtime == 'true' }}
        working-directory: packages/console-runtime
        run: pnpm publish --access public --no-git-checks

      # @gasboost/console is consumed by @gasboost/cli.
      - name: Build console
        if: ${{ needs.check-versions.outputs.publish-console == 'true' || needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm --filter @gasboost/console build

      - name: Typecheck console
        if: ${{ needs.check-versions.outputs.publish-console == 'true' }}
        run: pnpm --filter @gasboost/console typecheck

      - name: Test console
        if: ${{ needs.check-versions.outputs.publish-console == 'true' }}
        run: pnpm --filter @gasboost/console test

      - name: Verify console package contents
        if: ${{ needs.check-versions.outputs.publish-console == 'true' }}
        working-directory: packages/console
        run: pnpm pack

      - name: Publish console
        if: ${{ needs.check-versions.outputs.publish-console == 'true' }}
        working-directory: packages/console
        run: pnpm publish --access public --no-git-checks

      # @gasboost/cli consumes config, console-runtime and console.
      - name: Build cli
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm --filter @gasboost/cli build

      - name: Typecheck cli
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm --filter @gasboost/cli typecheck

      - name: Test cli
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        run: pnpm --filter @gasboost/cli test

      - name: Verify cli package contents
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        working-directory: packages/cli
        run: pnpm pack

      - name: Publish cli
        if: ${{ needs.check-versions.outputs.publish-cli == 'true' }}
        working-directory: packages/cli
        run: pnpm publish --access public --no-git-checks

      # @gasboost/create is a standalone project initializer.
      - name: Typecheck create
        if: ${{ needs.check-versions.outputs.publish-create == 'true' }}
        run: pnpm --filter @gasboost/create typecheck

      - name: Test create
        if: ${{ needs.check-versions.outputs.publish-create == 'true' }}
        run: pnpm --filter @gasboost/create test

      - name: Build create
        if: ${{ needs.check-versions.outputs.publish-create == 'true' }}
        run: pnpm --filter @gasboost/create build

      - name: Verify create package contents
        if: ${{ needs.check-versions.outputs.publish-create == 'true' }}
        working-directory: packages/create-gasboost
        run: pnpm pack

      - name: Publish create
        if: ${{ needs.check-versions.outputs.publish-create == 'true' }}
        working-directory: packages/create-gasboost
        run: pnpm publish --access public --no-git-checks
