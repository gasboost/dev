name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-version:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: packages/cli

    permissions:
      contents: read

    outputs:
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package version
        id: version
        run: |
          NAME=$(node -p "require('./${PACKAGE_DIR}/package.json').name")
          VERSION=$(node -p "require('./${PACKAGE_DIR}/package.json').version")

          echo "${NAME}@${VERSION}"

          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: ${{ needs.check-version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck cli
        run: pnpm --filter @gasboost/cli typecheck

      - name: Test cli
        run: pnpm --filter @gasboost/cli test

      - name: Build cli
        run: pnpm --filter @gasboost/cli build

      - name: Verify package contents cli
        run: pnpm --filter @gasboost/cli pack

      - name: Publish cli
        run: pnpm --filter @gasboost/cli publish --access public --no-git-checks
