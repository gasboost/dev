name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Typecheck packages
        run: pnpm -r typecheck

      - name: Test packages
        run: pnpm -r test

      - name: Verify package contents
        run: pnpm -r pack:check

      - name: Publish new package versions
        run: |
          for PACKAGE_DIR in packages/config packages/console-runtime packages/console packages/cli; do
            NAME=$(node -p "require('./${PACKAGE_DIR}/package.json').name")
            VERSION=$(node -p "require('./${PACKAGE_DIR}/package.json').version")

            if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
              echo "Skipping ${NAME}@${VERSION}: already published"
            else
              pnpm --filter "${NAME}" publish --access public --no-git-checks
            fi
          done
